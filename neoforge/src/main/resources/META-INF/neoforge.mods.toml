modLoader = "javafml"
# NeoForge's javafml, not Forge's — NeoForge 21.1 declares [3,] for itself, so [3,) accepts it and
# anything newer. The old Forge numbering ([37,)) matches nothing here and refuses to load.
loaderVersion = "[3,)"
license = "GPL-3.0-only"

[[mods]]
modId = "villagertradingplus"
version = "${version}"
displayName = "VillagerTradingPlus"
authors = "Finallion"
displayURL = "https://modrinth.com/mod/villagerstradingplus"
issueTrackerURL = "https://github.com/finallion/VillagersTradingPlus/issues"
logoFile = "villagertradingplus_logo.png"
description = '''
A library for defining villager and wandering trader trades in JSON, with conditions, dynamic pricing and an in-game trade catalog.
'''

# NeoForge does not read mixin configs from anywhere else — Fabric picks them up from
# fabric.mod.json, but here they have to be declared. Without this block not a single mixin applies:
# no trade-screen buttons, no catalogue, the offers-per-level config silently does nothing, and
# DataPackContentsMixin never hands the registries to the trade parser.
[[mixins]]
config = "villagertradingplus-common.mixins.json"

[[dependencies.villagertradingplus]]
modId = "neoforge"
# "mandatory" was replaced by "type" in the 1.20.5 loader generation.
type = "required"
versionRange = "[21.0.167,21.2.0)"
ordering = "NONE"
side = "BOTH"

[[dependencies.villagertradingplus]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,1.21.2)"
ordering = "NONE"
side = "BOTH"
