dependencies {
	implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
}

architectury {
	common(rootProject.enabled_platforms.split(","))
}

loom {
	accessWidenerPath = file("src/main/resources/villagertradingplus.accesswidener")
}

repositories {
	mavenCentral()
}

dependencies {
	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
	testImplementation "org.mockito:mockito-core:5.20.0"
}

test {
	useJUnitPlatform()
	jvmArgs "-XX:+EnableDynamicAgentLoading", "-Xmx2g"
	systemProperty "vtp.rootDir", rootProject.projectDir.absolutePath
	systemProperty "vtp.writeTemplates", providers.systemProperty("vtp.writeTemplates").getOrElse("false")
	testLogging {
		events "failed", "skipped"
		exceptionFormat "short"
	}
}
